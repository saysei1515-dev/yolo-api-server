<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ（ローカルAI版）</title>
  <!-- MediaPipe Object Detection のライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #121212; color: #fff; }
    input, button { font-size: 16px; padding: 12px; margin: 8px 0; width: 100%; max-width: 320px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:active { background: #0056b3; }
    .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    /* カメラ映像とキャンバスを重ねるためのコンテナ */
    .video-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      margin-top: 10px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status { margin-top: 10px; font-size: 16px; font-weight: bold; color: #aaa; }

    /* 検出画像のギャラリー用スタイル */
    #imageGallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .captured-thumb {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #00ff00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 AI探偵カメラ（ローカル）</h2>

    <div>
      <input type="text" id="targetObject" value="person" placeholder="探すもの (例: person, cup, chair)">
    </div>
    <div>
      <button id="startButton" onclick="startCamera()" disabled>AIモデルをロード中...</button>
    </div>

    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="outputCanvas"></canvas>
    </div>

    <p id="status">ステータス: AIモデルを準備しています...</p>

    <!-- 検出した画像を蓄積して表示するエリア -->
    <div style="margin-top: 15px; text-align: left;">
      <h4 style="margin: 5px 0; font-size: 14px; color: #ccc;">📸 発見した瞬間の画像（最大10枚）</h4>
      <div id="imageGallery"></div>
    </div>
  </div>

  <script type="module">
    import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2";

    let objectDetector = undefined;
    let runningMode = "VIDEO";
    let webcamRunning = false;
    const video = document.getElementById("video");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    let capturedImages = [];
    let lastCaptureTime = 0;

    // 1. MediaPipeのAIモデルを初期化
    async function initializeAImodel() {
      status.innerText = "ステータス: AIモデルをダウンロード中...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
        );
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite`,
            delegate: "GPU" // スマホのGPUを活用
          },
          scoreThreshold: 0.5,
          runningMode: runningMode
        });
        
        startButton.disabled = false;
        startButton.innerText = "カメラ起動 & 探索スタート";
        status.innerText = "ステータス: 準備完了";
        status.style.color = "#00ff00";
      } catch (err) {
        console.error(err);
        status.innerText = "エラー: AIのロードに失敗しました";
        status.style.color = "#ff4444";
      }
    }

    initializeAImodel();

    // 2. カメラの起動
    window.startCamera = async function() {
      if (!objectDetector) {
        alert("AIモデルの準備がまだできています。少し待ってください。");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }, // 弟さんを映すならインカメラ('user')、外向きなら 'environment'
          audio: false
        });

        video.srcObject = stream;
        webcamRunning = true;
        startButton.style.display = "none";
        status.innerText = "ステータス: 探索中（リアルタイム）";

        video.addEventListener("loadeddata", predictWebcam);
      } catch (err) {
        console.error(err);
        alert("カメラを起動できませんでした。権限を確認してください。");
      }
    };

    // 3. リアルタイム推論ループ
    let lastVideoTime = -1;
    async function predictWebcam() {
      if (!webcamRunning) return;

      // キャンバスのサイズを動画に合わせる
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const startTimeMs = performance.now();
        
        // AIによる物体検出を実行
        const detections = objectDetector.detectForVideo(video, startTimeMs);
        
        // 画面のクリアと描画
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const targetWord = document.getElementById("targetObject").value.trim().toLowerCase();
        let foundTarget = false;
        let detectedNames = [];

        for (let detection of detections.detections) {
          const categoryName = detection.categories[0].categoryName.toLowerCase();
          const score = Math.round(detection.categories[0].score * 100);
          detectedNames.push(`${categoryName} (${score}%)`);

          // ターゲットが含まれているかチェック
          if (categoryName.includes(targetWord)) {
            foundTarget = true;
            
            // バウンディングボックス（枠線）の描画
            const bbox = detection.bounding_box;
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 4;
            ctx.strokeRect(bbox.origin_x, bbox.origin_y, bbox.width, bbox.height);
            
            ctx.fillStyle = "#00ff00";
            ctx.font = "16px sans-serif";
            ctx.fillText(`${categoryName} ${score}%`, bbox.origin_x, bbox.origin_y > 20 ? bbox.origin_y - 5 : 20);
          }
        }

        if (foundTarget) {
          status.innerText = `🎉 発見！ (${targetWord})`;
          status.style.color = "#00ff00";

          // 3秒に1回ペースでギャラリーにストック
          const now = Date.now();
          if (now - lastCaptureTime > 3000) {
            saveCapturedImage();
            lastCaptureTime = now;
          }
        } else {
          if (detectedNames.length > 0) {
            status.innerText = `👀 映っているもの: ${detectedNames.join(', ')}`;
          } else {
            status.innerText = `🔍 探索中...`;
          }
          status.style.color = "#aaa";
        }
      }

      if (webcamRunning) {
        window.requestAnimationFrame(predictWebcam);
      }
    }

    // 4. ギャラリーへの保存処理
    function saveCapturedImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 160;
      tempCanvas.height = 120;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      
      const dataUrl = tempCanvas.toDataURL('image/jpeg');
      capturedImages.unshift(dataUrl);

      if (capturedImages.length > 10) {
        capturedImages.pop();
      }

      const gallery = document.getElementById('imageGallery');
      gallery.innerHTML = '';
      capturedImages.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'captured-thumb';
        gallery.appendChild(img);
      });
    }
  </script>
</body>
</html>
