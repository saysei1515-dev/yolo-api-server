<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINDRONE</title>
  <!-- MediaPipe Object Detection のライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #121212; color: #fff; }
    input, button { font-size: 16px; padding: 12px; margin: 6px 0; box-sizing: border-box; }
    input { width: 100%; max-width: 320px; }
    .btn-group { display: flex; gap: 8px; justify-content: center; max-width: 320px; margin: 0 auto; }
    button { background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    button:active { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-danger:active { background: #b02a37; }
    .btn-success { background: #28a745; }
    .btn-success:active { background: #218838; }

    .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    .video-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      margin-top: 10px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status { margin-top: 10px; font-size: 15px; font-weight: bold; color: #aaa; word-break: break-all; }

    #imageGallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .captured-thumb {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #00ff00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>FINDRONE</h2>

    <div>
      <input type="text" id="targetObject" value="cup" placeholder="探すもの (例: cup, cell phone)">
      <div class="btn-group">
        <button class="btn-success" onclick="updateTarget()">決定</button>
      </div>
    </div>

    <div>
      <button id="startButton" onclick="startCamera()" disabled>AIモデルをロード中...</button>
      <button id="stopButton" class="btn-danger" onclick="stopCamera()" style="display: none;">終了する</button>
    </div>

    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="outputCanvas"></canvas>
    </div>

    <p id="status">ステータス: AIモデルを準備しています...</p>

    <div style="margin-top: 15px; text-align: left;">
      <h4 style="margin: 5px 0; font-size: 14px; color: #ccc;">📸 発見した瞬間の画像（最大10枚）</h4>
      <div id="imageGallery"></div>
    </div>
  </div>

  <script type="module">
    import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2";

    let objectDetector = undefined;
    let runningMode = "VIDEO";
    let webcamRunning = false;
    const video = document.getElementById("video");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    let capturedImages = [];
    let lastCaptureTime = 0;
    let lastVideoTime = -1;
    let currentSearchWord = "cup";

    async function initializeAImodel() {
      status.innerText = "ステータス: AIモデルをダウンロード中...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
        );
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite`,
            delegate: "GPU"
          },
          scoreThreshold: 0.3,
          runningMode: runningMode
        });

        startButton.disabled = false;
        startButton.innerText = "カメラ起動 & 探索スタート";
        status.innerText = "ステータス: 準備完了";
        status.style.color = "#00ff00";
      } catch (err) {
        console.error(err);
        status.innerText = "エラー: AIのロードに失敗しました";
        status.style.color = "#ff4444";
      }
    }

    initializeAImodel();

    window.updateTarget = function() {
      const inputVal = document.getElementById("targetObject").value.trim().toLowerCase();
      if (inputVal === "") {
        alert("探すものを入力してください！");
        return;
      }
      currentSearchWord = inputVal;
      status.innerText = `🎯 探すものを「${currentSearchWord}」に変更しました`;
      status.style.color = "#00ff00";
    };

    window.startCamera = async function() {
      if (!objectDetector) return;
      currentSearchWord = document.getElementById("targetObject").value.trim().toLowerCase();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = stream;
        webcamRunning = true;
        startButton.style.display = "none";
        stopButton.style.display = "block";
        status.innerText = `ステータス: 探索中... (${currentSearchWord})`;

        video.onloadeddata = () => {
          predictWebcam();
        };
      } catch (err) {
        console.error(err);
        alert("カメラを起動できませんでした。");
      }
    };

    window.stopCamera = function() {
      webcamRunning = false;
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stopButton.style.display = "none";
      startButton.style.display = "block";
      status.innerText = "ステータス: 停止しました（準備完了）";
      status.style.color = "#aaa";
    };

    async function predictWebcam() {
      if (!webcamRunning) return;

      if (video.videoWidth > 0 && video.videoHeight > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
      }

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        try {
          const startTimeMs = performance.now();
          const detections = objectDetector.detectForVideo(video, startTimeMs);

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          let foundTarget = false;
          let detectedNames = [];

          if (detections && detections.detections) {
            for (let detection of detections.detections) {
              const categoryName = detection.categories[0].categoryName.toLowerCase();
              const score = Math.round(detection.categories[0].score * 100);
              detectedNames.push(`${categoryName}(${score}%)`);

              const isTarget = categoryName.includes(currentSearchWord);
              if (isTarget) {
                foundTarget = true;
              }

              const bbox = detection.bounding_box;
              ctx.strokeStyle = isTarget ? "#00ff00" : "#aaaaaa";
              ctx.lineWidth = isTarget ? 4 : 2;
              ctx.strokeRect(bbox.origin_x, bbox.origin_y, bbox.width, bbox.height);

              ctx.fillStyle = isTarget ? "#00ff00" : "#aaaaaa";
              ctx.font = "16px sans-serif";
              ctx.fillText(`${categoryName} ${score}%`, bbox.origin_x, bbox.origin_y > 20 ? bbox.origin_y - 5 : 20);
            }
          }

          if (foundTarget) {
            status.innerText = `🎉 発見！ (${currentSearchWord})`;
            status.style.color = "#00ff00";

            const now = Date.now();
            if (now - lastCaptureTime > 3000) {
              saveCapturedImage();
              lastCaptureTime = now;
            }
          } else {
            if (detectedNames.length > 0) {
              status.innerText = `👀 検出中: ${detectedNames.join(', ')} (探している物: ${currentSearchWord})`;
            } else {
              status.innerText = `🔍 探索中... (探している物: ${currentSearchWord})`;
            }
            status.style.color = "#aaa";
          }
        } catch (e) {
          console.error("推論エラー:", e);
        }
      }

      if (webcamRunning) {
        window.requestAnimationFrame(predictWebcam);
      }
    }

    function saveCapturedImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 160;
      tempCanvas.height = 120;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      const dataUrl = tempCanvas.toDataURL('image/jpeg');
      capturedImages.unshift(dataUrl);

      if (capturedImages.length > 10) {
        capturedImages.pop();
      }

      const gallery = document.getElementById('imageGallery');
      gallery.innerHTML = '';
      capturedImages.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'captured-thumb';
        gallery.appendChild(img);
      });
    }
  </script>
</body>
</html>
