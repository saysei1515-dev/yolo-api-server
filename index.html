<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ（Androidアプリ版）</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #121212; color: #fff; }
    input, button { font-size: 16px; padding: 12px; margin: 8px 0; width: 100%; max-width: 320px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:active { background: #0056b3; }
    .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    video { width: 100%; height: 240px; background: #000; border-radius: 8px; object-fit: cover; margin-top: 10px; }
    #status { margin-top: 10px; font-size: 16px; font-weight: bold; color: #aaa; }
    
    /* 検出画像のギャラリー用スタイル */
    #imageGallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .captured-thumb {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #00ff00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 AI探偵カメラ</h2>

    <div>
      <input type="text" id="targetObject" value="person" placeholder="探すもの (例: person, cup, chair)">
    </div>
    <div>
      <button onclick="startCamera()">カメラ起動 &amp; 探索スタート</button>
    </div>

    <div>
      <video id="video" autoplay playsinline muted></video>
    </div>

    <p id="status">ステータス: 待機中</p>

    <!-- 検出した画像を蓄積して表示するエリア -->
    <div style="margin-top: 15px; text-align: left;">
      <h4 style="margin: 5px 0; font-size: 14px; color: #ccc;">📸 発見した瞬間の画像（最大10枚）</h4>
      <div id="imageGallery"></div>
    </div>
  </div>

  <script>
    // Render上のバックエンドURL
    const RENDER_URL = "https://yolo-api-server-7.onrender.com/detect"; 

    async function startCamera() {
      const video = document.getElementById('video');
      const status = document.getElementById('status');

      status.innerText = "ステータス: カメラを起動しています...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = stream;
        status.innerText = "ステータス: 探索中（AI連携スタンバイ）";

        // 3秒ごとにフレームをキャプチャしてRenderへ送信するループ
        setInterval(() => {
          sendFrameToRender(video);
        }, 3000);

      } catch (err) {
        console.error(err);
        status.innerText = "エラー: " + err.message;
        alert("カメラを起動できませんでした。アプリの権限設定を確認してください。");
      }
    }

        const formData = new FormData();
