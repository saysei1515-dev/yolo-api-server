<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ（シンプル登録対応）</title>
  <link rel="stylesheet" href="style.css">

  <!-- MediaPipe & PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="app-container">
    <h1>🔍 AI探偵カメラ</h1>

    <!-- 🔗 モード切り替えタブ -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('search')">🔍 探索モード</button>
      <button class="tab-btn" onclick="switchTab('register')">📦 物体登録ページ</button>
    </div>

    <!-- ================= 探索モード画面 ================= -->
    <div id="searchTab" class="tab-content active">
      <div class="control-group" style="border: 2px solid #007bff; background: #f0f7ff;">
        <label for="pcIdInput" style="color: #007bff;">🔗 PC接続用ID:</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="pcIdInput" placeholder="PC側のIDを入力" style="flex: 1;">
          <button onclick="connectToPC()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">接続</button>
        </div>
        <div id="connectionStatus" style="font-size: 12px; color: #666; margin-top: 5px;">ステータス: 未接続</div>
      </div>

      <div class="control-group">
        <label for="targetObject">探すもの (英語または登録名):</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="targetObject" value="cup" placeholder="例: cup または 登録した名前" style="flex: 1;">
          <button onclick="updateTarget()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">決定</button>
        </div>
        <!-- 登録済みアイテムからワンタップで選択できるリスト -->
        <div id="quickSelectList" style="display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px;"></div>
      </div>

      <div class="control-group">
        <label for="modelSelect">AIモデル切り替え:</label>
        <select id="modelSelect" onchange="changeModel()">
          <option value="lite0">EfficientDet-Lite0 (高速・軽量)</option>
          <option value="lite2">EfficientDet-Lite2 (高精度)</option>
        </select>
      </div>

      <div class="camera-container" style="position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden;">
        <video id="video" autoplay muted playsinline style="width: 100%; display: block;"></video>
        <canvas id="outputCanvas" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%;"></canvas>
      </div>

      <div class="button-group" style="margin-top: 10px;">
        <button id="startButton" class="primary-btn" onclick="startCamera()" disabled>PCと接続してください</button>
        <button id="stopButton" class="danger-btn" onclick="stopCamera()" style="display:none;">停止</button>
      </div>

      <div id="status" class="status-box">ステータス: AIモデルをロード中...</div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
        <h3 style="margin: 0;">📁 発見したアイテムの履歴</h3>
        <button onclick="clearGallery()" style="padding: 5px 10px; background: #dc3545; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">履歴クリア</button>
      </div>
      <div id="imageGallery" class="gallery" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;"></div>
    </div>

    <!-- ================= 物体登録ページ画面 ================= -->
    <div id="registerTab" class="tab-content">
      <div class="control-group">
        <label for="registerName">登録するアイテム名 (英語):</label>
        <input type="text" id="registerName" placeholder="例: keys, wallet, remote" style="width: 100%; padding: 10px; box-sizing: border-box;">
      </div>

      <div class="button-group" style="margin-bottom: 10px;">
        <button onclick="startRegCamera()" style="width: 100%; padding: 10px; background: #17a2b8; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">📱 スマホのカメラを起動</button>
      </div>

      <div class="camera-container" style="position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden;">
        <video id="regVideo" autoplay muted playsinline style="width: 100%; display: block;"></video>
      </div>

      <div class="button-group" style="margin-top: 10px;">
        <button onclick="registerItemDirectly()" style="width: 100%; padding: 14px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer;">💾 このまま登録する</button>
      </div>

      <div id="regStatus" class="status-box" style="margin-top: 10px;">ステータス: カメラを起動してアイテム名を入力し、登録ボタンを押してください</div>

      <h3 style="margin: 20px 0 10px 0; font-size: 16px;">📦 登録済みアイテム一覧</h3>
      <div id="registeredList" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;"></div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
