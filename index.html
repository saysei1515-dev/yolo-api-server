<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ（スマート学習版）</title>
  <link rel="stylesheet" href="style.css">
  <!-- MediaPipe Object Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script>
  
  <!-- ▼ ここにTensorFlow.js系のライブラリを追加 ▼ -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.2/dist/knn-classifier.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>🔍 AI探偵カメラ</h2>

    <!-- モード切り替えタブ -->
    <div class="tab-container">
      <button id="tabSearch" class="tab-btn active" onclick="switchView('search')">🔍 探索モード</button>
      <button id="tabTrain" class="tab-btn" onclick="switchView('train')">🧠 AI登録モード</button>
    </div>

    <!-- ── ① 探索モード画面 ── -->
    <div id="searchView" class="view-section active">
      <div class="setting-group">
        <span class="setting-label">🧠 AIモデル</span>
        <select id="modelSelect" onchange="changeModel()">
          <option value="lite0">スタンダード (Lite0)</option>
          <option value="lite2" selected>ハイパフォーマンス (Lite2)</option>
        </select>
      </div>

      <div class="setting-group">
        <span class="setting-label">🎯 探すもの</span>
        <input type="text" id="targetObject" value="cup" placeholder="例: cup, cell phone, person">
        <div class="btn-group">
          <button class="btn-success" onclick="updateTarget()">決定</button>
        </div>
      </div>

      <div>
        <button id="startButton" onclick="startCamera()" disabled>AIモデルをロード中...</button>
        <button id="stopButton" class="btn-danger" onclick="stopCamera()" style="display: none;">終了する</button>
      </div>

      <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
      </div>

      <p id="status">ステータス: AIモデルを準備しています...</p>

      <div style="margin-top: 15px; text-align: left;">
        <h4 style="margin: 5px 0; font-size: 14px; color: #ccc;">📸 発見した瞬間の画像（最大10枚）</h4>
        <div id="imageGallery"></div>
      </div>
    </div>

    <!-- ── ② AI登録（学習）モード画面 ── -->
    <div id="trainView" class="view-section">
      <div class="setting-group">
        <span class="setting-label">🏷️ 覚えるアイテムの名前</span>
        <input type="text" id="newObjectName" value="my_guitar" placeholder="例: my_guitar, key">
      </div>

      <div class="angle-guide-box">
        <p id="angleGuideText" style="margin: 0 0 4px 0; font-weight: bold; color: #00ff00;">📸 ステップ1: 正面から撮影してください</p>
        <span id="angleCountText" style="color: #aaa; font-size: 12px;">現在の登録枚数: 正面(0/3) | 斜め(0/3) | 遠く(0/3)</span>
      </div>

      <div>
        <button id="trainCamStartBtn" class="btn-warning" onclick="startTrainCamera()">登録用カメラ起動</button>
        <button id="captureAngleBtn" class="btn-success" onclick="captureAngleImage()" style="display: none;">📸 この角度で撮影する</button>
      </div>

      <div class="train-video-container">
        <video id="trainVideo" autoplay playsinline muted></video>
      </div>

      <div style="margin-top: 10px; text-align: left;">
        <h4 style="margin: 5px 0; font-size: 14px; color: #ccc;">📁 撮影したトレーニング写真</h4>
        <div id="trainGallery"></div>
      </div>

      <div style="margin-top: 10px;">
        <button class="btn-success" onclick="trainAIModel()" style="background: #6f42c1;">✨ このデータでAIをトレーニングする</button>
      </div>
      <p id="trainStatus" style="margin-top: 8px; font-size: 13px; color: #aaa;">ステータス: 待機中</p>
    </div>

  </div>

  <!-- 外部JavaScriptファイルの読み込み（モジュールとして実行） -->
  <script type="module" src="app.js"></script>
</body>
</html>
