<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロストアイテム発見アプリ</title>
  <!-- TensorFlow.js と MobileNet の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; background: #222; color: #fff; }
    #cameraContainer { position: relative; display: inline-block; width: 100%; max-width: 400px; margin: 0 auto; }
    video, canvas { width: 100%; display: block; border-radius: 8px; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    #guideBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 160px; border: 3px dashed yellow; pointer-events: none; transition: width 0.2s, height 0.2s; }
    button { padding: 10px 15px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; background: #007bff; color: white; }
    button:active { background: #0056b3; }
    #status { margin: 10px; font-weight: bold; font-size: 18px; color: #aaa; }
    #imageGallery { display: flex; gap: 10px; overflow-x: auto; padding: 10px; justify-content: center; }
  </style>
</head>
<body>

  <h1>ロストアイテム発見アプリ</h1>
  <div id="status">AIモデル読み込み中...</div>

  <!-- 比率切り替えボタン -->
  <div class="aspect-controls">
    <button onclick="setAspectRatio('square')">正方形 (1:1)</button>
    <button onclick="setAspectRatio('landscape')">横長 (2:1)</button>
    <button onclick="setAspectRatio('portrait')">縦長 (1:2)</button>
  </div>

  <!-- カメラコンテナ -->
  <div id="cameraContainer">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="guideBox"></div>
  </div>

  <!-- 操作ボタン群 -->
  <div style="margin: 15px 0;">
    <button onclick="captureSampleWithCrop(0)" style="background: #28a745;">🎯 物体として撮影</button>
    <button onclick="captureSampleWithCrop(1)" style="background: #dc3545;">🔲 背景として撮影</button>
  </div>
  <div>
    <button onclick="trainAndRegister()" style="background: #ffc107; color: #000;">🧠 パワーアップ学習開始 (Epochs:30)</button>
    <button onclick="resetTrainingData()" style="background: #6c757d;">🔄 データリセット</button>
  </div>

  <!-- 発見履歴ギャラリー -->
  <h3>発見履歴</h3>
  <div id="imageGallery"></div>

  <script src="app.js"></script>
</body>
</html>
