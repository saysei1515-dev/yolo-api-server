<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ（YOLO挑戦版）</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- TensorFlow.js の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
</head>
<body>

  <div class="app-container">
    <h1>🔍 AI探偵カメラ（YOLO）</h1>

    <div class="control-group">
      <label for="targetObject">探すもの:</label>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="targetObject" value="person" placeholder="例: person, cup, remote" style="flex: 1;">
        <button onclick="updateTarget()" style="padding: 0 15px; background: #007bff; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">決定</button>
      </div>
    </div>

    <div class="camera-container">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="outputCanvas"></canvas>
    </div>

    <div class="button-group">
      <button id="startButton" class="primary-btn" onclick="startCamera()">カメラ起動 & YOLO探索スタート</button>
      <button id="stopButton" class="danger-btn" onclick="stopCamera()" style="display:none;">停止</button>
    </div>

    <div id="status" class="status-box">ステータス: YOLOモデルを準備中...</div>

    <h3>📁 発見したアイテムの履歴</h3>
    <div id="imageGallery" class="gallery"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
