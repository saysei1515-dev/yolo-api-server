<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINDRONE</title>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRコード生成ライブラリ (QRious) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: 20px; color: #00ff00; }
    #status { font-size: 16px; margin: 10px 0; color: #ffc107; }
    #qr-container { margin: 20px auto; background: #fff; padding: 15px; display: inline-block; border-radius: 8px; }
    video { width: 100%; max-width: 640px; border: 2px solid #00ff00; border-radius: 8px; background: #000; margin-top: 10px; }
    .peer-id-box { background: #222; padding: 10px; border-radius: 6px; display: inline-block; margin-top: 10px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

  <h1>FINDRONE</h1>
  <div id="status">ステータス: PeerJS接続を初期化中...</div>

  <div class="peer-id-box">
    PCのID: <span id="myId" style="color: #007bff; font-weight: bold;">取得中...</span>
  </div>

  <!-- QRコード表示エリア -->
  <div id="qr-container">
    <canvas id="qrCodeCanvas"></canvas>
    <div style="font-size: 12px; color: #333; margin-top: 5px; font-weight: bold;">アプリでスキャン</div>
  </div>

  <div>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const myIdEl = document.getElementById("myId");
    const remoteVideo = document.getElementById("remoteVideo");

    // PeerJS初期化
    const peer = new Peer();

    peer.on('open', (id) => {
      myIdEl.innerText = id;
      statusEl.innerText = "ステータス: スマホからの接続待ち...";
      statusEl.style.color = "#00ff00";

      // QRコードの生成 (スマホ側で読み取れるように現在のIDや接続用URLを埋め込むことも可能)
      // ここではスマホ側でID入力を自動化するため、ID文字列そのものをQR化します
      try {
        const qr = new QRious({
          element: document.getElementById('qrCodeCanvas'),
          value: id,
          size: 200
        });
      } catch (e) {
        console.error("QRコード生成失敗:", e);
      }
    });

    peer.on('connection', (conn) => {
      statusEl.innerText = "ステータス: スマホと接続完了！ 待機中...";
      statusEl.style.color = "#28a745";

      conn.on('data', (data) => {
        if (data.action === 'start') {
          statusEl.innerText = `ステータス: 「${data.keyword}」を探索中...`;
          
          // スマホのカメラ映像を自分（PC）のWebcamとして受け取るためコールバック
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then((stream) => {
              // PC側からスマホへ映像ストリームを返送してPeer接続を確立
              const call = peer.call(data.smartphoneId, stream);
              call.on('stream', (スマホからのストリーム) => {
                remoteVideo.srcObject = スマホからのストリーム;
              });
            })
            .catch(err => {
              console.error("カメラ取得エラー:", err);
            });
        } else if (data.action === 'stop') {
          statusEl.innerText = "ステータス: 探索が停止されました";
          remoteVideo.srcObject = null;
        }
      });
    });

    peer.on('error', (err) => {
      statusEl.innerText = "エラー: " + err.type;
      statusEl.style.color = "#ff4444";
    });
  </script>

</body>
</html>
