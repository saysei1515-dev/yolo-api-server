<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI探偵カメラ - PC側司令塔</title>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRコード生成ライブラリ (QRious) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <!-- ONNX Runtime Web (PC側でYOLOを動かすため) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: 20px; color: #00ff00; }
    #status { font-size: 16px; margin: 10px 0; color: #ffc107; }
    #qr-container { margin: 20px auto; background: #fff; padding: 15px; display: inline-block; border-radius: 8px; }
    .video-container { position: relative; display: inline-block; margin-top: 10px; }
    video { width: 100%; max-width: 640px; border: 2px solid #00ff00; border-radius: 8px; background: #000; display: block; }
    .peer-id-box { background: #222; padding: 10px; border-radius: 6px; display: inline-block; margin-top: 10px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

  <h1>司令塔モニター (PC)</h1>
  <div id="status">ステータス: PeerJS接続を初期化中...</div>

  <div class="peer-id-box">
    PCのID: <span id="myId" style="color: #007bff; font-weight: bold;">取得中...</span>
  </div>

  <div id="qr-container">
    <canvas id="qrCodeCanvas"></canvas>
    <div style="font-size: 12px; color: #333; margin-top: 5px; font-weight: bold;">スマホでスキャンして一発接続</div>
  </div>

  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline muted></video>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const myIdEl = document.getElementById("myId");
    const remoteVideo = document.getElementById("remoteVideo");

    const peer = new Peer();
    let yoloSession = null;
    let isYoloRunning = false;
    let activeConn = null;

    peer.on('open', (id) => {
      myIdEl.innerText = id;
      statusEl.innerText = "ステータス: スマホからの接続待ち...";
      statusEl.style.color = "#00ff00";

      try {
        new QRious({
          element: document.getElementById('qrCodeCanvas'),
          value: id,
          size: 200
        });
      } catch (e) {
        console.error("QRコード生成失敗:", e);
      }
    });

    peer.on('connection', (conn) => {
      activeConn = conn;
      statusEl.innerText = "ステータス: スマホと接続完了！";
      statusEl.style.color = "#28a745";

      conn.on('data', async (data) => {
        if (data.action === 'start') {
          statusEl.innerText = `ステータス: 「${data.keyword}」を探索中... (モデル: ${data.model})`;
          
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
            remoteVideo.srcObject = stream;

            // スマホにカメラ映像をストリーミング配信
            const call = peer.call(data.smartphoneId, stream);

            // もしYOLOモデルが指定された場合、PC側でYOLO推論を開始
            if (data.model === 'yolov8') {
              if (!yoloSession) {
                statusEl.innerText = "ステータス: PC側でYOLOv8モデルをロード中...";
                yoloSession = await ort.InferenceSession.create("https://cdn.jsdelivr.net/gh/ultralytics/assets/v0.0/yolov8n.onnx", { executionProviders: ['webgl', 'wasm'] });
              }
              isYoloRunning = true;
              runPCYoloLoop(conn);
            } else {
              isYoloRunning = false;
            }
          } catch (err) {
            console.error("カメラ取得・AI起動エラー:", err);
            statusEl.innerText = "エラー: カメラまたはAIの起動に失敗しました";
          }
        } else if (data.action === 'stop') {
          isYoloRunning = false;
          statusEl.innerText = "ステータス: 探索が停止されました";
          remoteVideo.srcObject = null;
        }
      });
    });

    // PC側でのYOLOv8バックグラウンド推論ループ
    async function runPCYoloLoop(conn) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 640;
      tempCanvas.height = 640;
      const tCtx = tempCanvas.getContext('2d');

      async function loop() {
        if (!isYoloRunning || !remoteVideo.videoWidth) {
          if (isYoloRunning) requestAnimationFrame(loop);
          return;
        }

        tCtx.drawImage(remoteVideo, 0, 0, 640, 640);
        const imgData = tCtx.getImageData(0, 0, 640, 640).data;

        const input = new Float32Array(1 * 3 * 640 * 640);
        for (let i = 0; i < 640 * 640; i++) {
          input[i] = imgData[i * 4] / 255.0;
          input[640 * 640 + i] = imgData[i * 4 + 1] / 255.0;
          input[2 * 640 * 640 + i] = imgData[i * 4 + 2] / 255.0;
        }

        const tensor = new ort.Tensor('float32', input, [1, 3, 640, 640]);
        const results = await yoloSession.run({ images: tensor });
        const output = results[Object.keys(results)[0]].data;

        let detections = [];
        for (let i = 0; i < 8400; i++) {
          const confidence = output[4 * 8400 + i];
          if (confidence > 0.4) {
            detections.push({
              x: output[0 * 8400 + i] - output[2 * 8400 + i] / 2,
              y: output[1 * 8400 + i] - output[3 * 8400 + i] / 2,
              w: output[2 * 8400 + i],
              h: output[3 * 8400 + i],
              score: Math.round(confidence * 100)
            });
          }
        }

        // 検出結果をスマホに送信
        if (conn && conn.open) {
          conn.send({ action: 'yolo_result', detections: detections });
        }

        if (isYoloRunning) {
          setTimeout(loop, 100); // 約10fpsでPC側処理
        }
      }
      loop();
    }
  </script>

</body>
</html>
